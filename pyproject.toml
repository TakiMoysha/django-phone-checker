[project]
name = "phone-checker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncio>=0.27.0",
  "anyio>=4.9.0",
  "dishka>=1.5.3",
  "django>=5.2",
  "httpx[http2,socks]>=0.28.1",
  "psycopg>=3.2.6",
  "psycopg-binary>=3.2.6",
  "django-ninja>=1.4.1",
  "django-background-tasks>=1.2.8",
  "phonenumbers>=9.0.4",
  "django-stubs>=5.1.3",
  "aiofiles>=24.1.0",
  "daphne>=4.1.2",
  "celery>=5.5.2",
  "pydantic[email]>=2.11.3",
]

[dependency-groups]
dev = [
    "bpython>=0.25",
    "faker>=37.1.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-django>=4.11.1",
    "unittest-parametrize>=1.6.0",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "phonechecker.app.settings"

[tool.pytest.ini_option]
DJANOG_SETTINGS_MODULE = "phonechecker.app.settings"
python_files = ["test_*.py", "*_test.py", "test/*.py"]
